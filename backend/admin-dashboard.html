
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Abdur Rahman</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 30px;
            font-family: Arial, sans-serif;
            color: #f3f7ff;
            background: #070b14;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: clamp(24px, 4vw, 34px);
        }

        header p {
            margin-top: 8px;
            color: #9aa9c0;
        }

        button {
            padding: 11px 17px;
            border: 1px solid #34435c;
            border-radius: 9px;
            color: white;
            background: #141e30;
            cursor: pointer;
        }

        button:hover {
            border-color: #39a9ff;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card, .messages-panel {
            padding: 23px;
            border: 1px solid #202e44;
            border-radius: 16px;
            background: linear-gradient(145deg, #111a2a, #0b111d);
        }

        .stat-card p {
            color: #9aa9c0;
            margin-bottom: 12px;
        }

        .stat-card h2 {
            font-size: 32px;
            color: #61baff;
        }

        .messages-panel h2 {
            margin-bottom: 20px;
        }

        #status {
            margin-bottom: 15px;
            color: #9fcfff;
        }

        .message-list {
            display: grid;
            gap: 15px;
        }

        .message-card {
            padding: 18px;
            border: 1px solid #26354c;
            border-radius: 12px;
            background: #0b1220;
            overflow-wrap: anywhere;
        }

        .message-card h3 {
            margin-bottom: 8px;
        }

        .message-card .email {
            color: #69bcff;
            margin-bottom: 12px;
        }

        .message-card .date {
            margin-top: 14px;
            font-size: 12px;
            color: #8392aa;
        }

        .empty {
            padding: 24px 0;
            color: #9aa9c0;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px;
            }

            header {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>Admin Dashboard</h1>
            <p>Abdur Rahman | Portfolio Messages</p>
        </div>

        <button id="logout-button" type="button">Logout</button>
    </header>

    <section class="stats">
        <div class="stat-card">
            <p>Total Messages</p>
            <h2 id="total-messages">0</h2>
        </div>
    </section>

    <main class="messages-panel">
        <h2>Contact Messages</h2>
        <p id="status" role="status" aria-live="polite">Loading messages...</p>
        <div id="message-list" class="message-list"></div>
    </main>

    <script src="admin-dashboard.js"></script>
</body>
</html>
